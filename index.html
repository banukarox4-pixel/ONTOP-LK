<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fashion UI Clone</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      background:#f5f5f5;
    }

    /* TOP BAR */
    .top-bar{
      background:#ffffff;
      padding:10px 5%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      border-bottom:1px solid #eee;
    }

    .logo{
      font-size:40px;
      font-weight:700;
    }

    .logo span{
      color:#ff6ca8;
    }

    .search-box{
      display:flex;
      width:40%;
      background:#f2f2f2;
      border-radius:50px;
      overflow:hidden;
    }

    .search-box input{
      flex:1;
      border:none;
      outline:none;
      padding:15px;
      background:transparent;
      font-size:16px;
    }

    .search-box button{
      border:none;
      padding:15px 35px;
      background:#ff6ca8;
      color:white;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
    }

    .search-box button:hover{
      background:#ff4f94;
    }

    .icons{
      display:flex;
      gap:20px;
      font-size:24px;
      cursor:pointer;
    }

    /* NAVBAR */
    .navbar{
      background:#2f3159;
      padding:0 5%;
      display:flex;
      align-items:center;
      gap:30px;
      height:70px;
    }

    .categories{
      background:#ff6ca8;
      color:white;
      padding:22px 25px;
      font-weight:600;
      cursor:pointer;
    }

    .navbar a{
      color:white;
      text-decoration:none;
      font-weight:500;
      transition:0.3s;
    }

    .navbar a:hover{
      color:#ff6ca8;
    }

    /* HERO SECTION */
    .hero{
      width:90%;
      margin:30px auto;
      height:500px;
      border-radius:20px;
      overflow:hidden;
      position:relative;
      background:url('https://images.unsplash.com/photo-1529139574466-a303027c1d8b?q=80&w=1400&auto=format&fit=crop') center/cover no-repeat;
    }

    .overlay{
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.25);
      display:flex;
      align-items:center;
      justify-content:flex-end;
      padding-right:80px;
    }

    .hero-text{
      color:white;
      text-align:right;
    }

    .hero-text h1{
      font-size:70px;
      line-height:1;
      margin-bottom:20px;
      text-transform:uppercase;
      font-weight:700;
    }

    .hero-text p{
      font-size:40px;
      font-style:italic;
      margin-bottom:25px;
    }

    .hero-text button{
      padding:15px 40px;
      border:none;
      background:#ff6ca8;
      color:white;
      font-size:18px;
      border-radius:40px;
      cursor:pointer;
      transition:0.3s;
    }

    .hero-text button:hover{
      background:#ff4f94;
      transform:scale(1.05);
    }

    /* NEW ARRIVALS */
    .section-title{
      text-align:center;
      font-size:40px;
      margin:50px 0 30px;
      font-weight:700;
    }

    .products{
      width:90%;
      margin:auto;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:25px;
      padding-bottom:60px;
    }

    .card{
      background:white;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 10px 25px rgba(0,0,0,0.08);
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-10px);
    }

    .card img{
      width:100%;
      height:320px;
      object-fit:cover;
    }

    .card-content{
      padding:20px;
    }

    .card-content h3{
      margin-bottom:10px;
    }

    .price{
      color:#ff6ca8;
      font-size:22px;
      font-weight:700;
    }

    @media(max-width:900px){

      .search-box{
        width:100%;
        margin:20px 0;
      }

      .top-bar{
        flex-direction:column;
        gap:20px;
      }

      .navbar{
        flex-wrap:wrap;
        height:auto;
        padding:20px;
      }

      .hero{
        height:400px;
      }

      .hero-text h1{
        font-size:45px;
      }

      .hero-text p{
        font-size:25px;
      }
    }
  </style>
</head>

<body>

  <!-- TOP -->
  <div class="top-bar">

    <div class="logo">
      ON TOP <span>LK</span>
    </div>

    <div class="search-box">
      <input type="text" placeholder="Search...">
      <button>Search</button>
    </div>

    <div class="icons">
      👤 🛒
    </div>

  </div>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="categories">
      ☰ Shopping By Categories
    </div>

    <a href="#">NEW IN</a>
    <a href="#">Best Selling</a>
    <a href="#">Top</a>
    <a href="#">Accessories</a>
    <a href="#">Plus Size</a>
    <a href="#">Pre-Sale</a>
    <a href="#">About</a>
  </div>

  <!-- HERO -->
  <section class="hero">
    <div class="overlay">

      <div class="hero-text">
        <h1>HOT SELLING</h1>
        <p>casual coat</p>
        <button>Shop Now</button>
      </div>

    </div>
  </section>

  <!-- PRODUCTS -->
  <h2 class="section-title">New Arrivals</h2>

  <div class="products">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?q=80&w=1200&auto=format&fit=crop">
      <div class="card-content">
        <h3>Women Fashion Jacket</h3>
        <div class="price">$39.99</div>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1200&auto=format&fit=crop">
      <div class="card-content">
        <h3>Casual Hoodie</h3>
        <div class="price">$29.99</div>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?q=80&w=1200&auto=format&fit=crop">
      <div class="card-content">
        <h3>Luxury Coat</h3>
        <div class="price">$59.99</div>
      </div>
    </div>

  </div>

</body>
</html>
