<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ON TOP LK</title>

  <link rel="stylesheet" href="style.css">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <!-- TOP BAR -->
  <div class="top-bar">

    <div class="logo">
      ON TOP <span>LK</span>
    </div>

    <div class="search-box">
      <input type="text" placeholder="Search Products">
      <button>Search</button>
    </div>

    <div class="icons">
      👤 🛒
    </div>

  </div>

  <!-- NAVBAR -->
  <div class="navbar">

    <div class="categories">
      ☰ Categories
    </div>

    <a href="#">NEW IN</a>
    <a href="#">Best Selling</a>
    <a href="#">Top</a>
    <a href="#">Accessories</a>
    <a href="#">About</a>

  </div>

  <!-- HERO -->
  <section class="hero">

    <div class="overlay">

      <div class="hero-text">
        <h1>ON TOP LK</h1>
        <p>Best Fashion Collection</p>
        <button>Shop Now</button>
      </div>

    </div>

  </section>

  <!-- PRODUCTS -->
  <h2 class="section-title">New Arrivals</h2>

  <div class="products">

    <!-- CARD 1 -->
    <div class="card">

      <img src="./images/product1.jpg">

      <div class="card-content">
        <h3>Fashion Jacket</h3>
        <div class="price">LKR 12,500</div>
      </div>

    </div>

    <!-- CARD 2 -->
    <div class="card">

      <img src="./images/product2.jpg">

      <div class="card-content">
        <h3>Casual Hoodie</h3>
        <div class="price">LKR 8,900</div>
      </div>

    </div>

    <!-- CARD 3 -->
    <div class="card">

      <img src="./images/product3.jpg">

      <div class="card-content">
        <h3>Luxury Coat</h3>
        <div class="price">LKR 15,000</div>
      </div>

    </div>

  </div>

</body>

</html>
